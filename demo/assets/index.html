<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Motion generation demo</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1c2024;
      --muted: #6b7580;
      --faint: #98a1a8;
      --line: #e2e5e8;
      --panel: #fffffff5;
      --surface: #f6f7f8;
      --button: #f1f3f4;
      --accent: #e8663f;
      --accent-ink: #ffffff;
      --skeleton: #57cdb0;
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #fff;
      color: var(--ink);
      font: 14px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif;
    }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    #gl-canvas, #canvas { position: fixed; inset: 0; }
    #canvas { background: transparent; }
    #hint {
      position: fixed;
      top: 18px;
      left: 340px;
      color: var(--faint);
      font-size: 12.5px;
      pointer-events: none;
    }
    #panel {
      position: fixed;
      top: 16px;
      left: 16px;
      width: 312px;
      max-height: calc(100% - 32px);
      overflow: auto;
      padding: 18px;
      background: var(--panel);
      backdrop-filter: blur(6px);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 12px 32px #1c202414;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    h1 .link {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }
    h1 .link:hover:not(.disabled) { color: var(--ink); }
    h1 .link.disabled { color: var(--faint); cursor: default; }
    h2 {
      margin: 0 0 10px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    section.block {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }
    section.block:first-child { margin-top: 0; padding-top: 0; border-top: none; }
    label { display: block; margin: 12px 0 6px; font-weight: 600; font-size: 13px; }
    label:first-child { margin-top: 0; }
    textarea, input, select {
      display: block;
      width: 100%;
      color: inherit;
      background: #fff;
      border: 1px solid #d3d8db;
      border-radius: 8px;
      font: inherit;
    }
    textarea { min-height: 60px; resize: vertical; padding: 9px 10px; }
    input, select { height: 34px; padding: 0 10px; }
    textarea:disabled, input:disabled, select:disabled { opacity: .5; }
    textarea:focus, input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px #e8663f22;
    }
    .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0 8px; margin-top: 14px; }
    #segments {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .segment-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 8px 8px 4px;
      background: var(--surface);
      border: 1px solid transparent;
      border-radius: 10px;
      cursor: pointer;
      transition: background .1s, border-color .1s;
    }
    .segment-row:hover { background: #eef0f1; }
    .segment-row.selected {
      background: #e8663f14;
      border-color: #e8663f55;
    }
    .segment-row.dragging { opacity: .35; }
    .segment-placeholder {
      height: 40px;
      border: 1.5px dashed var(--accent);
      border-radius: 10px;
      background: #e8663f0f;
    }
    .drag-handle {
      flex: none;
      width: 18px;
      text-align: center;
      color: var(--faint);
      cursor: grab;
      font-size: 14px;
      line-height: 1;
      user-select: none;
      touch-action: none;
    }
    .drag-handle:active { cursor: grabbing; }
    .segment-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .segment-title {
      font-size: 13px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .segment-meta {
      font-size: 11.5px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .segment-remove {
      flex: none;
      height: 24px;
      width: 24px;
      padding: 0;
      line-height: 1;
      border: none;
      background: transparent;
      color: var(--faint);
      font-size: 15px;
    }
    .segment-remove:hover { color: #a52b20; background: #a52b2014; }
    #add-segment {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 8px;
      margin-top: 6px;
      color: var(--muted);
      background: transparent;
      border: 1.5px dashed #cfd4d7;
      border-radius: 10px;
      font: inherit;
      font-weight: 600;
      font-size: 12.5px;
      cursor: pointer;
      width: 100%;
    }
    #add-segment:hover { color: var(--ink); border-color: var(--faint); background: var(--surface); }
    #segments-empty {
      padding: 14px 10px;
      color: var(--muted);
      font-size: 12.5px;
      background: var(--surface);
      border-radius: 10px;
      text-align: center;
    }
    #steps {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-top: 10px;
    }
    .step-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 6px 6px 10px;
      background: var(--surface);
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      transition: background .1s, border-color .1s;
    }
    .step-row:hover { background: #eef0f1; }
    .step-row.selected {
      background: #e8663f14;
      border-color: #e8663f55;
    }
    .step-info {
      flex: 1;
      min-width: 0;
      font-size: 12.5px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .step-remove {
      flex: none;
      height: 22px;
      width: 22px;
      padding: 0;
      line-height: 1;
      border: none;
      background: transparent;
      color: var(--faint);
      font-size: 14px;
    }
    .step-remove:hover { color: #a52b20; background: #a52b2014; }
    #add-step {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 7px 8px;
      margin-top: 6px;
      color: var(--muted);
      background: transparent;
      border: 1.5px dashed #cfd4d7;
      border-radius: 8px;
      font: inherit;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      width: 100%;
    }
    #add-step:hover { color: var(--ink); border-color: var(--faint); background: var(--surface); }
    #add-step:disabled { cursor: default; opacity: .5; }
    #steps-empty {
      padding: 10px;
      color: var(--muted);
      font-size: 12px;
      background: var(--surface);
      border-radius: 8px;
      text-align: center;
    }
    button {
      height: 34px;
      padding: 0 12px;
      color: inherit;
      background: var(--button);
      border: 1px solid #d3d8db;
      border-radius: 8px;
      font: inherit;
      cursor: pointer;
    }
    button:hover:not(:disabled) { background: #e8ebed; }
    button:disabled { cursor: default; opacity: .5; }
    #generate {
      display: block;
      width: 100%;
      height: 44px;
      margin-top: 4px;
      background: var(--accent);
      border: none;
      color: var(--accent-ink);
      font-weight: 700;
      font-size: 14px;
      border-radius: 10px;
      box-shadow: 0 6px 16px #e8663f38;
    }
    #generate:hover:not(:disabled) { background: #d85a35; }
    #generate:disabled { background: #e8663f88; box-shadow: none; opacity: 1; }
    #readout {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 5px 10px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 12.5px;
    }
    #state { color: var(--ink); font-weight: 650; }
    #error { min-height: 18px; margin-top: 8px; color: #a52b20; font-size: 12.5px; }
    @media (max-width: 700px) {
      #panel { width: calc(100% - 32px); max-height: 52%; }
      #hint { display: none; }
    }
  </style>
</head>
<body>
  <canvas id="gl-canvas"></canvas>
  <canvas id="canvas"></canvas>
  <div id="hint">Click anywhere in the scene to place the start position</div>
  <section id="panel">
    <section class="block">
      <h1>Segments <span class="link" id="clear-segments">Clear all</span></h1>
      <div id="segments"></div>
      <button id="add-segment" type="button">+ Add segment</button>
    </section>

    <section class="block">
      <h2 id="editor-title">New segment</h2>
      <label for="prompt">Motion prompt</label>
      <textarea id="prompt" maxlength="2000" placeholder="The person walks."></textarea>
      <div class="grid">
        <div>
          <label for="scene-cfg">Scene CFG</label>
          <input id="scene-cfg" type="number" min="0" max="10" step="0.5" value="3">
        </div>
        <div>
          <label for="text-cfg">Text CFG</label>
          <input id="text-cfg" type="number" min="0" max="10" step="0.5" value="3">
        </div>
        <div>
          <label for="goal-cfg">Goal CFG</label>
          <input id="goal-cfg" type="number" min="0" max="10" step="0.5" value="3">
        </div>
      </div>
      <label>Steps</label>
      <div id="steps"></div>
      <button id="add-step" type="button">+ Add step (waypoint or continue)</button>
      <label for="target-height">Selected step waypoint height (m)</label>
      <input id="target-height" type="number" step="0.05">
    </section>

    <section class="block">
      <button id="generate" type="button">Generate motion</button>
      <div id="readout">
        <span>Playback</span><span id="state">Ready</span>
        <span>Generation</span><span id="latency">—</span>
      </div>
      <div id="error" role="status" aria-live="polite"></div>
    </section>
  </section>
  <script id="settings" type="application/json">__SETTINGS__</script>
  <script type="module">
    "use strict";
    import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";

    const settings = JSON.parse(document.getElementById("settings").textContent);
    const canvas = document.getElementById("canvas");
    const context = canvas.getContext("2d");
    const glCanvas = document.getElementById("gl-canvas");
    const promptInput = document.getElementById("prompt");
    const textCfgInput = document.getElementById("text-cfg");
    const sceneCfgInput = document.getElementById("scene-cfg");
    const goalCfgInput = document.getElementById("goal-cfg");
    const heightInput = document.getElementById("target-height");
    const editorTitle = document.getElementById("editor-title");
    const segmentList = document.getElementById("segments");
    const addSegmentButton = document.getElementById("add-segment");
    const clearSegmentsLink = document.getElementById("clear-segments");
    const stepList = document.getElementById("steps");
    const addStepButton = document.getElementById("add-step");
    const generateButton = document.getElementById("generate");
    const stateLabel = document.getElementById("state");
    const latencyLabel = document.getElementById("latency");
    const errorLabel = document.getElementById("error");
    const hintLabel = document.getElementById("hint");
    const HINT_BEFORE_PLACE = "Click anywhere in the scene to place the start position";
    const HINT_AFTER_PLACE = "Drag to orbit · Ctrl/⌘+drag to pan · Scroll to zoom";
    function updateHint() {
      hintLabel.textContent = startPlaced ? HINT_AFTER_PLACE : HINT_BEFORE_PLACE;
    }

    const GRID_SPACING = 1;
    const GRID_EXTENT = 7;
    const START_ARROW_LENGTH = 0.45;
    const WINDOW_FRAMES = settings.windowFrames;
    // A segment groups one text prompt + one set of CFG values with an
    // ordered list of steps. Each step becomes exactly one autoregressive
    // /window call using the segment's shared prompt/CFG: a step with a
    // target waypoint steers that call toward a goal, a step with no target
    // just continues the same segment's motion for another window's worth of
    // frames. Running a segment "autoregressively multiple times" is simply
    // flattening its steps into consecutive /window requests (see
    // flattenSteps/generateMotion below).
    let segments = [];
    let nextSegmentId = 1;
    let nextStepId = 1;
    let selectedSegmentId = null;
    let selectedStepId = null;
    // List reordering is driven by our own pointer tracking rather than native
    // HTML5 drag-and-drop: rebuilding the row DOM mid-drag (needed to show the
    // placeholder) destroys the dragged element, which breaks a native drag
    // session. Pointer events have no such session to break.
    let listDragSourceIndex = null;
    let listDragOverIndex = null;
    let suppressRowClick = false;
    let motion = [];
    // The demo always conditions on the same single scene (or none, if the
    // model has scene conditioning disabled) — see settings.sceneName.
    const globalScene = settings.sceneName;
    let previewSceneBounds = null;
    let previewMeshes = [];
    let previewBoxes = [];
    let previewBoxFaces = [];
    let previewSceneRequestId = 0;
    // Where a fresh rollout spawns -- deliberately not auto-placed anywhere
    // on load. The user's first click in the scene sets it (see
    // canvas.onpointerup); nothing is drawn or generatable before that.
    let startPoint = null;
    let startPlaced = false;
    let defaultStart = [settings.start[0], settings.start[1], settings.defaultHeight];
    // Facing angle (radians) the rollout spawns with. Null means "use the
    // default", same convention as startPoint; dragging the orientation
    // handle sets it explicitly.
    let startYaw = null;
    let defaultStartYaw = settings.startYaw;
    let currentFrame = 0;
    let pending = null;
    let revision = 0;
    let paused = false;
    let generating = false;
    let generationProgress = "";
    let motionDirty = true;
    let lastFrameTime = performance.now();
    let yaw = -0.7;
    let pitch = 0.35;
    let zoom = 1;
    let center = [settings.start[0], settings.start[1], 0.65];
    // The model's local z is already height above the floor, but the
    // floor's own world-space height varies per scene (a real recording's
    // floor is rarely at z=0 -- see demo.py's settings["floorZ"], sourced
    // from the scene's own measured floor). Used as the fallback plane
    // whenever a click doesn't land on real geometry (raycastSurface); using
    // a hardcoded 0 there was placing clicks at the wrong height (e.g. ~3-5m
    // above a real room's actual floor).
    const floorZ = Number.isFinite(settings.floorZ) ? settings.floorZ : 0;
    const radius = 2.2;
    let dragging = false;
    let stepDrag = null;
    let startDrag = null;
    let orientDrag = null;
    let panning = false;
    // Once the user pans manually, stop the auto-follow camera from fighting
    // them; a fresh generation (resetPlayback) restores it.
    let manualCamera = false;
    let pointer = [0, 0];
    let pointerStart = [0, 0];

    // Real 3D rendering (scene meshes/boxes, skeleton) via three.js instead
    // of a hand-rolled canvas painter's algorithm -- a real depth buffer and
    // real lighting/shading, "rendered normally" rather than approximated.
    // The 2D canvas on top stays for UI overlay only: markers, the dashed
    // waypoint path, the reference grid, and the scene-crop point preview,
    // all still positioned with `project()` (now backed by the three.js
    // camera) so they line up with the WebGL layer beneath.
    const LIGHT_AMBIENT_INTENSITY = 1.1;
    const LIGHT_DIFFUSE_INTENSITY = 2.4;
    const glRenderer = new THREE.WebGLRenderer({canvas: glCanvas, antialias: true, alpha: true});
    glRenderer.shadowMap.enabled = true;
    glRenderer.shadowMap.type = THREE.PCFSoftShadowMap;
    const glScene = new THREE.Scene();
    const glCamera = new THREE.PerspectiveCamera(50, 1, 0.05, 500);
    // World is Z-up (floor height is z), not three.js's default Y-up.
    glCamera.up.set(0, 0, 1);

    glScene.add(new THREE.AmbientLight(0xffffff, LIGHT_AMBIENT_INTENSITY));
    const glLight = new THREE.DirectionalLight(0xffffff, LIGHT_DIFFUSE_INTENSITY);
    glLight.castShadow = true;
    glLight.shadow.mapSize.set(1024, 1024);
    glLight.shadow.camera.left = -12;
    glLight.shadow.camera.right = 12;
    glLight.shadow.camera.top = 12;
    glLight.shadow.camera.bottom = -12;
    glLight.shadow.camera.near = 0.5;
    glLight.shadow.camera.far = 40;
    glLight.shadow.bias = -0.0015;
    glScene.add(glLight);
    glScene.add(glLight.target);

    const glSceneGroup = new THREE.Group();
    glScene.add(glSceneGroup);

    function syncCamera() {
      const distance = (radius * 4) / zoom;
      const position = new THREE.Vector3(
        center[0] + Math.sin(yaw) * Math.cos(pitch) * distance,
        center[1] + Math.cos(yaw) * Math.cos(pitch) * distance,
        center[2] + Math.sin(pitch) * distance,
      );
      glCamera.position.copy(position);
      glCamera.lookAt(center[0], center[1], center[2]);
      glCamera.aspect = innerWidth / innerHeight;
      glCamera.updateProjectionMatrix();
      glLight.position.set(position.x, position.y, position.z + 6);
      glLight.target.position.set(center[0], center[1], center[2]);
    }

    // Screen-space projection of a world point, via the same camera the
    // WebGL layer renders with -- keeps 2D overlay markers/lines aligned
    // with the 3D scene beneath them. Third return value scales with
    // apparent size (bigger when closer to the camera), replacing what the
    // old hand-rolled `perspective` value was used for.
    function project(point) {
      const world = new THREE.Vector3(point[0], point[1], point[2]);
      const distanceToCamera = Math.max(0.05, glCamera.position.distanceTo(world));
      const perspective = (radius * 4) / distanceToCamera;
      const ndc = world.clone().project(glCamera);
      return [
        (ndc.x * 0.5 + 0.5) * innerWidth,
        (1 - (ndc.y * 0.5 + 0.5)) * innerHeight,
        Number.isFinite(perspective) ? perspective : 1,
      ];
    }

    const raycaster = new THREE.Raycaster();
    function screenToFloor(screenX, screenY, planeZ = floorZ) {
      const ndc = new THREE.Vector2(
        (screenX / innerWidth) * 2 - 1,
        -(screenY / innerHeight) * 2 + 1,
      );
      raycaster.setFromCamera(ndc, glCamera);
      const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), -planeZ);
      const hit = new THREE.Vector3();
      if (!raycaster.ray.intersectPlane(plane, hit)) return null;
      return [hit.x, hit.y, planeZ];
    }

    // Where a click actually lands: the real scene geometry's own surface
    // (exact, since it hits the same meshes/boxes the WebGL layer renders --
    // no separate voxel-grid lookup needed) if the ray hits anything, else
    // the flat floor plane. Used to place the start marker where the user
    // clicked, one pelvis-height (settings.defaultHeight) above the surface.
    function raycastSurface(screenX, screenY) {
      const ndc = new THREE.Vector2(
        (screenX / innerWidth) * 2 - 1,
        -(screenY / innerHeight) * 2 + 1,
      );
      raycaster.setFromCamera(ndc, glCamera);
      const hits = raycaster.intersectObjects(glSceneGroup.children, false);
      if (hits.length) {
        const point = hits[0].point;
        return [point.x, point.y, point.z];
      }
      return screenToFloor(screenX, screenY, floorZ);
    }

    promptInput.disabled = !settings.textEnabled;
    if (!settings.textEnabled) {
      promptInput.placeholder = "Text conditioning is disabled in this model";
      textCfgInput.disabled = true;
    }
    sceneCfgInput.disabled = !settings.sceneEnabled;
    goalCfgInput.disabled = !settings.goalEnabled;
    heightInput.disabled = true;
    heightInput.value = settings.defaultHeight.toFixed(2);

    function finiteNumber(input, fallback, minimum, maximum) {
      const value = Number(input.value);
      if (!Number.isFinite(value)) return fallback;
      return Math.min(maximum, Math.max(minimum, value));
    }

    function markDirty() {
      motionDirty = true;
      updateGenerateButton();
    }

    function selectedSegment() {
      return segments.find(item => item.id === selectedSegmentId) || null;
    }

    function selectedStep() {
      const segment = selectedSegment();
      if (!segment) return null;
      return segment.steps.find(step => step.id === selectedStepId) || null;
    }

    // Every step across every segment, in the exact order they'll be sent to
    // /window (segment order, then step order within each segment).
    function flattenSteps() {
      const list = [];
      segments.forEach((segment, segmentIndex) => {
        segment.steps.forEach((step, stepIndex) => {
          list.push({segment, step, segmentIndex, stepIndex});
        });
      });
      return list;
    }

    function selectSegment(id) {
      selectedSegmentId = id;
      const segment = selectedSegment();
      if (segment) {
        promptInput.value = segment.prompt;
        textCfgInput.value = segment.textGuidance;
        sceneCfgInput.value = segment.sceneGuidance;
        goalCfgInput.value = segment.goalGuidance;
        selectedStepId = segment.steps.length ? segment.steps[0].id : null;
      } else {
        selectedStepId = null;
      }
      refreshHeightInput();
      updateSegmentPanel();
      updateStepPanel();
    }

    function selectStep(id) {
      selectedStepId = id;
      refreshHeightInput();
      updateStepPanel();
    }

    function refreshHeightInput() {
      const step = selectedStep();
      heightInput.disabled = !step || !step.target;
      heightInput.value = (step && step.target) ? step.target[2].toFixed(2) : settings.defaultHeight.toFixed(2);
    }

    function newSegmentDefaults() {
      return {
        prompt: settings.textEnabled ? promptInput.value : "",
        textGuidance: finiteNumber(textCfgInput, 3, 0, 10),
        sceneGuidance: settings.sceneEnabled ? finiteNumber(sceneCfgInput, 3, 0, 10) : 0,
        goalGuidance: settings.goalEnabled ? finiteNumber(goalCfgInput, 3, 0, 10) : 0,
      };
    }

    function addSegment() {
      const segment = Object.assign(
        {id: nextSegmentId++, steps: [{id: nextStepId++, target: null}]},
        newSegmentDefaults(),
      );
      segments.push(segment);
      selectSegment(segment.id);
      markDirty();
    }

    function removeSegment(id) {
      segments = segments.filter(item => item.id !== id);
      if (selectedSegmentId === id) {
        selectedSegmentId = null;
        selectedStepId = null;
      }
      refreshHeightInput();
      updateSegmentPanel();
      updateStepPanel();
      markDirty();
    }

    function addStep() {
      const segment = selectedSegment();
      if (!segment) return;
      const step = {id: nextStepId++, target: null};
      segment.steps.push(step);
      selectStep(step.id);
      updateSegmentPanel();
      markDirty();
    }

    function removeStep(id) {
      const segment = selectedSegment();
      if (!segment) return;
      segment.steps = segment.steps.filter(step => step.id !== id);
      if (selectedStepId === id) {
        selectedStepId = segment.steps.length ? segment.steps[0].id : null;
      }
      refreshHeightInput();
      updateStepPanel();
      updateSegmentPanel();
      markDirty();
    }

    function segmentSummary(segment) {
      const stepCount = segment.steps.length;
      const waypointCount = segment.steps.filter(step => step.target).length;
      let stepsText = stepCount + (stepCount === 1 ? " step" : " steps");
      if (waypointCount) stepsText += " · " + waypointCount + (waypointCount === 1 ? " waypoint" : " waypoints");
      const textOff = settings.textEnabled && segment.textGuidance <= 0 ? " · text off" : "";
      const sceneOff = settings.sceneEnabled && segment.sceneGuidance <= 0 ? " · scene off" : "";
      const goalOff = settings.goalEnabled && waypointCount && segment.goalGuidance <= 0 ? " · goal off" : "";
      return stepsText + textOff + sceneOff + goalOff;
    }

    function stepSummary(step) {
      return step.target
        ? "(" + step.target[0].toFixed(2) + ", " + step.target[1].toFixed(2) + ", " + step.target[2].toFixed(2) + ")"
        : "No waypoint — continue";
    }

    function reorderList(from, insertAt) {
      if (from === null || insertAt === null || from === insertAt) return;
      const [moved] = segments.splice(from, 1);
      segments.splice(insertAt > from ? insertAt - 1 : insertAt, 0, moved);
      updateSegmentPanel();
      markDirty();
    }

    function updateSegmentPanel() {
      segmentList.innerHTML = "";
      if (!segments.length) {
        const empty = document.createElement("div");
        empty.id = "segments-empty";
        empty.textContent = "No segments yet.";
        segmentList.appendChild(empty);
      }

      function appendPlaceholder() {
        const placeholder = document.createElement("div");
        placeholder.className = "segment-placeholder";
        segmentList.appendChild(placeholder);
      }

      segments.forEach((segment, index) => {
        if (listDragSourceIndex !== null && listDragOverIndex === index) appendPlaceholder();

        const row = document.createElement("div");
        row.className = "segment-row" +
          (segment.id === selectedSegmentId ? " selected" : "") +
          (index === listDragSourceIndex ? " dragging" : "");

        const handle = document.createElement("span");
        handle.className = "drag-handle";
        handle.textContent = "⠿";
        handle.addEventListener("pointerdown", event => {
          if (event.button !== 0) return;
          event.preventDefault();
          event.stopPropagation();
          listDragSourceIndex = index;
          listDragOverIndex = index;
          updateSegmentPanel();
        });
        row.appendChild(handle);

        const info = document.createElement("div");
        info.className = "segment-info";
        const title = document.createElement("div");
        title.className = "segment-title";
        title.textContent = (index + 1) + ". " + (segment.prompt || "(no prompt)");
        const meta = document.createElement("div");
        meta.className = "segment-meta";
        meta.textContent = segmentSummary(segment);
        info.appendChild(title);
        info.appendChild(meta);
        row.appendChild(info);

        const removeButton = document.createElement("button");
        removeButton.type = "button";
        removeButton.className = "segment-remove";
        removeButton.textContent = "×";
        removeButton.onclick = event => {
          event.stopPropagation();
          removeSegment(segment.id);
        };
        row.appendChild(removeButton);

        row.onclick = () => {
          if (suppressRowClick) return;
          selectSegment(segment.id);
        };
        segmentList.appendChild(row);
      });
      if (listDragSourceIndex !== null && listDragOverIndex === segments.length) appendPlaceholder();
      editorTitle.textContent = selectedSegmentId
        ? "Segment " + (segments.findIndex(s => s.id === selectedSegmentId) + 1)
        : "New segment";
    }

    function updateStepPanel() {
      stepList.innerHTML = "";
      const segment = selectedSegment();
      addStepButton.disabled = !segment;
      const steps = segment ? segment.steps : [];
      if (!steps.length) {
        const empty = document.createElement("div");
        empty.id = "steps-empty";
        empty.textContent = segment ? "No steps yet." : "Select a segment to edit its steps.";
        stepList.appendChild(empty);
      }

      steps.forEach((step, index) => {
        const row = document.createElement("div");
        row.className = "step-row" + (step.id === selectedStepId ? " selected" : "");

        const info = document.createElement("div");
        info.className = "step-info";
        info.textContent = (index + 1) + ". " + stepSummary(step);
        row.appendChild(info);

        const removeButton = document.createElement("button");
        removeButton.type = "button";
        removeButton.className = "step-remove";
        removeButton.textContent = "×";
        removeButton.onclick = event => {
          event.stopPropagation();
          removeStep(step.id);
        };
        row.appendChild(removeButton);

        row.onclick = () => selectStep(step.id);
        stepList.appendChild(row);
      });
    }

    // Pointer-driven list reordering: measure row rects directly rather than
    // hit-testing via elementFromPoint. The placeholder div inserted below is
    // not a .segment-row, so once the cursor sits over it a hit-test-based
    // approach loses the row underneath and falls back incorrectly; comparing
    // cursor Y against every row's own rect has no such gap.
    addEventListener("pointermove", event => {
      if (listDragSourceIndex === null) return;
      const rows = Array.from(segmentList.querySelectorAll(".segment-row"));
      let insertAt = rows.length;
      for (let i = 0; i < rows.length; i += 1) {
        const rect = rows[i].getBoundingClientRect();
        if (event.clientY < rect.top + rect.height / 2) {
          insertAt = i;
          break;
        }
      }
      if (insertAt !== listDragOverIndex) {
        listDragOverIndex = insertAt;
        updateSegmentPanel();
      }
    });
    addEventListener("pointerup", () => {
      if (listDragSourceIndex === null) return;
      const from = listDragSourceIndex;
      const to = listDragOverIndex;
      listDragSourceIndex = null;
      listDragOverIndex = null;
      reorderList(from, to);
      suppressRowClick = true;
      setTimeout(() => { suppressRowClick = false; }, 0);
    });

    function updateGenerateButton() {
      if (generating) {
        generateButton.disabled = true;
        generateButton.textContent = generationProgress || "Generating…";
        return;
      }
      if (!startPlaced) {
        generateButton.disabled = true;
        generateButton.textContent = "Click the scene to place a start";
        return;
      }
      generateButton.disabled = false;
      generateButton.textContent = (motion.length && !motionDirty) ? "Replay" : "Generate motion";
    }

    function updateReadout() {
      if (generating) stateLabel.textContent = generationProgress;
      else if (!motion.length) stateLabel.textContent = "Ready";
      else if (paused && currentFrame === motion.length - 1) stateLabel.textContent = "Finished";
      else if (paused) stateLabel.textContent = "Paused";
      else stateLabel.textContent = "Playing";
      updateGenerateButton();
    }

    function currentJoints() {
      return motion.length ? motion[currentFrame] : null;
    }

    // Real scene geometry (meshes preferred, boxes as fallback per object --
    // same precedence the server's /scene/geometry payload already encodes)
    // loaded as actual three.js meshes with computed vertex normals, so
    // lighting comes from the real GPU pipeline instead of any hand-rolled
    // approximation. Rebuilt only when a new scene loads (see
    // loadSceneGeometry), not per frame.
    const BOX_TRIANGLE_INDICES = [];
    function sceneMaterial(color) {
      return new THREE.MeshStandardMaterial({
        color: new THREE.Color(color[0], color[1], color[2]),
        roughness: 0.85,
        metalness: 0.04,
      });
    }
    function setSceneGeometry(meshes, boxes, boxFaces) {
      while (glSceneGroup.children.length) {
        const child = glSceneGroup.children.pop();
        child.geometry.dispose();
        child.material.dispose();
      }
      if (BOX_TRIANGLE_INDICES.length === 0 && boxFaces.length) {
        boxFaces.forEach(([a, b, c, d]) => BOX_TRIANGLE_INDICES.push(a, b, c, a, c, d));
      }
      meshes.forEach(mesh => {
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", new THREE.Float32BufferAttribute(mesh.vertices.flat(), 3));
        geometry.setIndex(mesh.faces.flat());
        geometry.computeVertexNormals();
        const object = new THREE.Mesh(geometry, sceneMaterial(mesh.color));
        object.castShadow = true;
        object.receiveShadow = true;
        glSceneGroup.add(object);
      });
      boxes.forEach(box => {
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", new THREE.Float32BufferAttribute(box.corners.flat(), 3));
        geometry.setIndex(BOX_TRIANGLE_INDICES);
        geometry.computeVertexNormals();
        const object = new THREE.Mesh(geometry, sceneMaterial(box.color));
        object.castShadow = true;
        object.receiveShadow = true;
        glSceneGroup.add(object);
      });
    }

    // The skeleton as real capsule-ish geometry (cylinders + sphere joints),
    // built once and repositioned every frame rather than rebuilt -- cheap
    // to update, avoids per-frame allocation. Depth-tests and casts/receives
    // shadows against the room exactly like any other three.js mesh, so
    // furniture correctly occludes it (and it correctly shadows the floor)
    // for free, instead of a hand-rolled painter's-algorithm sort.
    const BONE_RADIUS = 0.045; // meters; matches tmp/render_gifs.py's BONE_RADIUS
    const JOINT_RADIUS = 0.05; // meters; matches tmp/render_gifs.py's JOINT_RADIUS
    const skeletonGroup = new THREE.Group();
    glScene.add(skeletonGroup);
    const boneMaterial = new THREE.MeshStandardMaterial({color: 0x4fa892, roughness: 0.55, metalness: 0.05});
    const jointMaterial = new THREE.MeshStandardMaterial({color: 0x293238, roughness: 0.5, metalness: 0.05});
    const boneMeshes = settings.parents.map((parent) => {
      if (parent < 0) return null;
      const geometry = new THREE.CylinderGeometry(BONE_RADIUS, BONE_RADIUS, 1, 10, 1, false);
      geometry.translate(0, 0.5, 0); // pivot at the base so scaling on Y grows from the parent joint
      const mesh = new THREE.Mesh(geometry, boneMaterial);
      mesh.castShadow = true;
      skeletonGroup.add(mesh);
      return mesh;
    });
    const jointMeshes = settings.parents.map(() => {
      const mesh = new THREE.Mesh(new THREE.SphereGeometry(JOINT_RADIUS, 12, 8), jointMaterial);
      mesh.castShadow = true;
      skeletonGroup.add(mesh);
      return mesh;
    });
    const boneUp = new THREE.Vector3(0, 1, 0);

    function updateSkeleton(joints) {
      skeletonGroup.visible = !!joints;
      if (!joints) return;
      settings.parents.forEach((parent, joint) => {
        const mesh = boneMeshes[joint];
        if (!mesh) return;
        const a = joints[parent], b = joints[joint];
        const direction = new THREE.Vector3(b[0] - a[0], b[1] - a[1], b[2] - a[2]);
        const length = Math.max(1e-4, direction.length());
        mesh.position.set(a[0], a[1], a[2]);
        mesh.scale.set(1, length, 1);
        mesh.quaternion.setFromUnitVectors(boneUp, direction.normalize());
      });
      joints.forEach((joint, index) => jointMeshes[index].position.set(joint[0], joint[1], joint[2]));
    }

    function drawMarker(point, color, label, size = 7) {
      const [x, y] = project(point);
      context.fillStyle = color;
      context.beginPath();
      context.arc(x, y, size, 0, 2 * Math.PI);
      context.fill();
      if (label) {
        context.fillStyle = "#202529";
        context.font = "600 12px system-ui";
        context.fillText(label, x + 10, y - 8);
      }
    }

    function drawStartOrientation(point, yawValue, active) {
      const tip = startOrientationTip(point, yawValue);
      const [x1, y1] = project(point);
      const [x2, y2] = project(tip);
      context.strokeStyle = "#287d69";
      context.lineWidth = active ? 3 : 2;
      context.beginPath();
      context.moveTo(x1, y1);
      context.lineTo(x2, y2);
      const angle = Math.atan2(y2 - y1, x2 - x1);
      const headLength = 8;
      context.moveTo(
        x2 - headLength * Math.cos(angle - Math.PI / 6),
        y2 - headLength * Math.sin(angle - Math.PI / 6),
      );
      context.lineTo(x2, y2);
      context.lineTo(
        x2 - headLength * Math.cos(angle + Math.PI / 6),
        y2 - headLength * Math.sin(angle + Math.PI / 6),
      );
      context.stroke();
      context.fillStyle = active ? "#f0a329" : "#287d69";
      context.beginPath();
      context.arc(x2, y2, active ? 8 : 5, 0, 2 * Math.PI);
      context.fill();
    }

    function drawGhostMarker(point) {
      const [x, y] = project(point);
      context.save();
      context.setLineDash([3, 3]);
      context.lineWidth = 1.5;
      context.strokeStyle = "#98a1a8";
      context.beginPath();
      context.arc(x, y, 7, 0, 2 * Math.PI);
      context.stroke();
      context.restore();
    }

    function drawPlaceholderMarker(point, label) {
      const [x, y] = project(point);
      context.save();
      context.setLineDash([4, 3]);
      context.lineWidth = 2;
      context.strokeStyle = "#f0a329";
      context.fillStyle = "#f0a32933";
      context.beginPath();
      context.arc(x, y, 10, 0, 2 * Math.PI);
      context.fill();
      context.stroke();
      context.restore();
      context.fillStyle = "#202529";
      context.font = "600 12px system-ui";
      const text = label + "  (" + point[0].toFixed(2) + ", " + point[1].toFixed(2) + ")";
      context.fillText(text, x + 14, y - 8);
    }

    function hitTestStart(screenX, screenY) {
      if (!startPlaced) return false;
      const [x, y] = project(effectiveStart());
      return Math.hypot(x - screenX, y - screenY) <= 16;
    }

    function hitTestStartOrientation(screenX, screenY) {
      if (!startPlaced) return false;
      const tip = startOrientationTip(effectiveStart(), effectiveStartYaw());
      const [x, y] = project(tip);
      return Math.hypot(x - screenX, y - screenY) <= 16;
    }

    function hitTestStepTarget(screenX, screenY) {
      let closest = null;
      let closestDistance = 16;
      flattenSteps().forEach(entry => {
        if (!entry.step.target) return;
        const [x, y] = project(entry.step.target);
        const distance = Math.hypot(x - screenX, y - screenY);
        if (distance <= closestDistance) {
          closest = entry;
          closestDistance = distance;
        }
      });
      return closest;
    }

    function draw() {
      const ratio = devicePixelRatio || 1;
      canvas.width = innerWidth * ratio;
      canvas.height = innerHeight * ratio;
      context.setTransform(ratio, 0, 0, ratio, 0, 0);
      context.clearRect(0, 0, innerWidth, innerHeight);

      glRenderer.setPixelRatio(ratio);
      glRenderer.setSize(innerWidth, innerHeight, false);
      syncCamera();
      // A scene-geometry or skeleton bug shouldn't be able to freeze the
      // whole animation loop -- animate() only re-schedules itself after
      // draw() returns.
      try {
        updateSkeleton(currentJoints());
        glRenderer.render(glScene, glCamera);
      } catch (error) {
        console.error("Scene render failed:", error);
      }

      // The flat reference grid only makes sense with no real scene loaded —
      // a real room's floor is rarely at world z=0, so the grid would float
      // in space unrelated to it. The point cloud is the ground truth then.
      if (!globalScene) {
        const minimumX = Math.floor((center[0] - GRID_EXTENT) / GRID_SPACING) * GRID_SPACING;
        const maximumX = Math.ceil((center[0] + GRID_EXTENT) / GRID_SPACING) * GRID_SPACING;
        const minimumY = Math.floor((center[1] - GRID_EXTENT) / GRID_SPACING) * GRID_SPACING;
        const maximumY = Math.ceil((center[1] + GRID_EXTENT) / GRID_SPACING) * GRID_SPACING;
        context.strokeStyle = "#dce1e4";
        context.lineWidth = 1;
        context.beginPath();
        for (let x = minimumX; x <= maximumX; x += GRID_SPACING) {
          const [x1, y1] = project([x, minimumY, floorZ]);
          const [x2, y2] = project([x, maximumY, floorZ]);
          context.moveTo(x1, y1);
          context.lineTo(x2, y2);
        }
        for (let y = minimumY; y <= maximumY; y += GRID_SPACING) {
          const [x1, y1] = project([minimumX, y, floorZ]);
          const [x2, y2] = project([maximumX, y, floorZ]);
          context.moveTo(x1, y1);
          context.lineTo(x2, y2);
        }
        context.stroke();
      }

      const startNow = startDrag ? startDrag.previewPoint : effectiveStart();
      const withTargets = flattenSteps().filter(entry => entry.step.target);
      if (withTargets.length) {
        context.strokeStyle = "#e86f51aa";
        context.lineWidth = 2;
        context.setLineDash([6, 4]);
        context.beginPath();
        const [startX, startY] = project(startNow);
        context.moveTo(startX, startY);
        withTargets.forEach(({step}) => {
          const [x, y] = project(step.target);
          context.lineTo(x, y);
        });
        context.stroke();
        context.setLineDash([]);
        withTargets.forEach(({step, segmentIndex, stepIndex}) => {
          const label = (segmentIndex + 1) + "." + (stepIndex + 1);
          if (stepDrag && step.id === stepDrag.step.id) {
            drawGhostMarker(stepDrag.origin);
            drawPlaceholderMarker(step.target, label);
            return;
          }
          drawMarker(
            step.target,
            step.id === selectedStepId ? "#f0a329" : "#e86f51",
            label,
            step.id === selectedStepId ? 9 : 7,
          );
        });
      }
      // Draggable spawn point for a fresh rollout, once the user has placed
      // one (see canvas.onpointerup) -- nothing is drawn here before that
      // first click. The arrow sets its facing yaw the same way: drag the
      // handle at its tip.
      if (startPlaced) {
        const startYawNow = orientDrag ? orientDrag.previewYaw : effectiveStartYaw();
        drawStartOrientation(startNow, startYawNow, !!orientDrag);
        drawMarker(startNow, "#287d69", "Start", startDrag ? 9 : 6);
      }
    }

    function responseFrames(value) {
      if (!Array.isArray(value) || value.length !== WINDOW_FRAMES) return null;
      for (const frame of value) {
        if (!Array.isArray(frame) || frame.length !== 24) return null;
        for (const joint of frame) {
          if (!Array.isArray(joint) || joint.length !== 3 ||
              joint.some(coordinate => !Number.isFinite(coordinate))) return null;
        }
      }
      return value;
    }

    let scenePreviewPromise = null;
    function loadScenePreview() {
      if (!scenePreviewPromise) {
        scenePreviewPromise = fetch("/scene")
          .then(response => response.ok ? response.json() : {bounds: null})
          .then(data => ({
            bounds: Array.isArray(data.bounds) ? data.bounds : null,
          }))
          .catch(() => ({bounds: null}));
      }
      return scenePreviewPromise;
    }

    function responseMeshes(value) {
      if (!Array.isArray(value)) return [];
      return value.filter(mesh =>
        mesh && Array.isArray(mesh.vertices) && Array.isArray(mesh.faces) &&
        Array.isArray(mesh.color)
      );
    }

    function responseBoxes(value) {
      if (!Array.isArray(value)) return [];
      return value.filter(box =>
        box && Array.isArray(box.corners) && box.corners.length === 8 &&
        Array.isArray(box.color)
      );
    }

    let sceneGeometryPromise = null;
    function loadSceneGeometry() {
      if (!sceneGeometryPromise) {
        sceneGeometryPromise = fetch("/scene/geometry")
          .then(response => response.ok ? response.json() : {meshes: [], boxes: [], boxFaces: []})
          .then(data => ({
            meshes: responseMeshes(data.meshes),
            boxes: responseBoxes(data.boxes),
            boxFaces: Array.isArray(data.boxFaces) ? data.boxFaces : [],
          }))
          .catch(() => ({meshes: [], boxes: [], boxFaces: []}));
      }
      return sceneGeometryPromise;
    }

    async function refreshScenePreview() {
      const requestId = ++previewSceneRequestId;
      if (!globalScene) {
        previewSceneBounds = null;
        previewMeshes = [];
        previewBoxes = [];
        previewBoxFaces = [];
        setSceneGeometry([], [], []);
        await refreshDefaultStart();
        return;
      }
      const [bounds, geometry] = await Promise.all([
        loadScenePreview(),
        loadSceneGeometry(),
      ]);
      if (requestId !== previewSceneRequestId) return;
      previewSceneBounds = bounds.bounds;
      previewMeshes = geometry.meshes;
      previewBoxes = geometry.boxes;
      previewBoxFaces = geometry.boxFaces;
      setSceneGeometry(previewMeshes, previewBoxes, previewBoxFaces);
      await refreshDefaultStart();
    }

    function effectiveStart() {
      return startPoint || defaultStart;
    }

    function effectiveStartYaw() {
      return startYaw !== null ? startYaw : defaultStartYaw;
    }

    // `yaw` throughout this app (and the model) is the angle of the
    // character's LATERAL axis (src/utils/geometry.py's facing_yaw uses
    // left_hip - right_hip, then yaw_rotation/anchor_local build the
    // world<->local transform directly off that angle) -- not the forward-
    // facing direction. Forward is lateral rotated -90 deg, i.e.
    // (sin(yaw), -cos(yaw)) rather than the naive (cos(yaw), sin(yaw)).
    // Drawing the arrow along the naive vector pointed it a quarter turn
    // off from the direction the character actually ends up facing.
    function forwardVector(yawValue) {
      return [Math.sin(yawValue), -Math.cos(yawValue)];
    }

    function startOrientationTip(point, yawValue) {
      const [fx, fy] = forwardVector(yawValue);
      return [
        point[0] + fx * START_ARROW_LENGTH,
        point[1] + fy * START_ARROW_LENGTH,
        point[2],
      ];
    }

    function clampPoint(x, y) {
      if (previewSceneBounds) {
        const [lo, hi] = previewSceneBounds;
        return [
          Math.min(hi[0], Math.max(lo[0], x)),
          Math.min(hi[1], Math.max(lo[1], y)),
        ];
      }
      const limit = settings.waypointLimit;
      return [
        Math.max(-limit, Math.min(limit, x)),
        Math.max(-limit, Math.min(limit, y)),
      ];
    }

    async function surfaceHeightAt(x, y) {
      if (!globalScene) return floorZ;
      try {
        const response = await fetch("/scene/surface?x=" + x + "&y=" + y);
        if (!response.ok) return floorZ;
        const data = await response.json();
        return Number.isFinite(data.height) ? data.height : floorZ;
      } catch {
        return floorZ;
      }
    }

    // The default spawn: a selected scene's own footprint center (so you
    // land inside the room instead of some arbitrary recorded point), or the
    // flat-floor --start when no scene is loaded.
    async function refreshDefaultStart() {
      if (!globalScene || !previewSceneBounds) {
        defaultStart = [settings.start[0], settings.start[1], settings.defaultHeight];
        return;
      }
      const [lo, hi] = previewSceneBounds;
      const centerX = (lo[0] + hi[0]) / 2;
      const centerY = (lo[1] + hi[1]) / 2;
      const surface = await surfaceHeightAt(centerX, centerY);
      defaultStart = [centerX, centerY, (surface !== null ? surface : lo[2]) + settings.defaultHeight];
      // Bring the room into view immediately, as long as nothing is already
      // playing and the user hasn't taken manual control of the camera.
      if (!motion.length && !manualCamera) {
        center[0] = defaultStart[0];
        center[1] = defaultStart[1];
        center[2] = defaultStart[2] - 0.3;
      }
    }

    function advanceFrame() {
      if (!motion.length) return;
      if (currentFrame + 1 < motion.length) {
        currentFrame += 1;
      } else {
        paused = true;
      }
      updateReadout();
    }

    function animate(time) {
      const joints = currentJoints();
      if (joints) {
        const follow = 1 - Math.exp(-Math.max(0, time - lastFrameTime) / 350);
        center[0] += (joints[0][0] - center[0]) * follow;
        center[1] += (joints[0][1] - center[1]) * follow;
        center[2] += (joints[0][2] + 0.55 - center[2]) * follow;
      }
      if (!paused && motion.length) {
        const frameDuration = 1000 / settings.fps;
        if (time - lastFrameTime >= frameDuration) {
          lastFrameTime += frameDuration;
          advanceFrame();
        }
      } else {
        lastFrameTime = time;
      }
      draw();
      requestAnimationFrame(animate);
    }

    function controlChanged(input, fallback, minimum, maximum) {
      const value = finiteNumber(input, fallback, minimum, maximum);
      input.value = value;
    }

    promptInput.addEventListener("input", () => {
      const segment = selectedSegment();
      if (segment) segment.prompt = promptInput.value;
      updateSegmentPanel();
      markDirty();
    });
    textCfgInput.addEventListener("change", () => {
      controlChanged(textCfgInput, 3, 0, 10);
      const segment = selectedSegment();
      if (segment) segment.textGuidance = finiteNumber(textCfgInput, 3, 0, 10);
      updateSegmentPanel();
      markDirty();
    });
    sceneCfgInput.addEventListener("change", () => {
      controlChanged(sceneCfgInput, 3, 0, 10);
      const segment = selectedSegment();
      if (segment) segment.sceneGuidance = finiteNumber(sceneCfgInput, 3, 0, 10);
      updateSegmentPanel();
      markDirty();
    });
    goalCfgInput.addEventListener("change", () => {
      controlChanged(goalCfgInput, 3, 0, 10);
      const segment = selectedSegment();
      if (segment) segment.goalGuidance = finiteNumber(goalCfgInput, 3, 0, 10);
      updateSegmentPanel();
      markDirty();
    });
    heightInput.addEventListener("change", () => {
      const step = selectedStep();
      if (!step || !step.target) return;
      controlChanged(heightInput, step.target[2], -Infinity, Infinity);
      step.target[2] = finiteNumber(heightInput, step.target[2], -Infinity, Infinity);
      updateStepPanel();
      markDirty();
    });

    function resetPlayback() {
      motion = [];
      currentFrame = 0;
      paused = false;
      generationProgress = "";
      latencyLabel.textContent = "—";
      manualCamera = false;
      const start = effectiveStart();
      center[0] = start[0];
      center[1] = start[1];
      center[2] = start[2] - 0.3;
      lastFrameTime = performance.now();
    }

    async function generateMotion() {
      revision += 1;
      if (pending) pending.controller.abort();
      const request = {
        revision,
        controller: new AbortController(),
      };
      pending = request;
      resetPlayback();
      generating = true;
      errorLabel.textContent = "";
      updateReadout();

      // Flatten segments -> steps into one entry per /window call: every
      // step in a segment shares that segment's prompt/CFG values and runs
      // as its own autoregressive request, in order.
      const flatPlan = flattenSteps().map(({segment, step}) => ({
        prompt: segment.prompt,
        textGuidance: segment.textGuidance,
        sceneGuidance: segment.sceneGuidance,
        goalGuidance: segment.goalGuidance,
        target: step.target,
      }));
      const plan = flatPlan.length
        ? flatPlan
        : [Object.assign({target: null}, newSegmentDefaults())];
      const generated = [];
      // The rollout state is an opaque blob the server round-trips (it holds
      // the trailing history of world-space joints plus the anchor pose), so
      // it's echoed back untouched rather than rebuilt client-side. A null
      // state cold-starts the character.
      let rolloutState = null;
      let totalLatency = 0;

      try {
        for (let index = 0; index < plan.length; index += 1) {
          const item = plan[index];
          generationProgress = "Window " + (index + 1) + "/" + plan.length;
          updateReadout();
          const response = await fetch("/window", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            signal: request.controller.signal,
            body: JSON.stringify({
              state: rolloutState,
              prompt: item.prompt,
              target: item.target,
              start: effectiveStart(),
              startYaw: effectiveStartYaw(),
              textGuidance: item.textGuidance,
              sceneGuidance: settings.sceneEnabled ? item.sceneGuidance : 0,
              goalGuidance: settings.goalEnabled ? item.goalGuidance : 0,
              windowIndex: index,
            }),
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || "Generation failed");
          const frames = responseFrames(result.frames);
          if (!frames || result.windowIndex !== index || !result.state) {
            throw new Error("The server returned an invalid motion window.");
          }
          if (pending !== request || request.revision !== revision) return;
          generated.push(...frames);
          rolloutState = result.state;
          totalLatency += Number(result.latencyMs) || 0;
        }

        if (pending !== request || request.revision !== revision) return;
        motion = generated;
        pending = null;
        generating = false;
        motionDirty = false;
        currentFrame = 0;
        paused = false;
        latencyLabel.textContent = Math.round(totalLatency) + " ms";
        lastFrameTime = performance.now();
      } catch (error) {
        if (pending === request) pending = null;
        if (error.name === "AbortError" || request.revision !== revision) return;
        generating = false;
        errorLabel.textContent = error.message;
      }
      updateReadout();
    }

    addSegmentButton.onclick = addSegment;
    addStepButton.onclick = addStep;
    clearSegmentsLink.onclick = () => {
      if (!segments.length) return;
      segments = [];
      selectedSegmentId = null;
      selectedStepId = null;
      refreshHeightInput();
      updateSegmentPanel();
      updateStepPanel();
      markDirty();
    };
    generateButton.onclick = () => {
      if (generating) return;
      if (motion.length && !motionDirty) {
        // Replay: restart playback without contacting the server.
        currentFrame = 0;
        paused = false;
        lastFrameTime = performance.now();
        updateReadout();
        return;
      }
      generateMotion();
    };

    canvas.onpointerdown = event => {
      if (event.button !== 0) return;
      pointer = [event.clientX, event.clientY];
      pointerStart = [...pointer];
      canvas.setPointerCapture(event.pointerId);
      const hit = hitTestStepTarget(event.clientX, event.clientY);
      if (hit) {
        selectSegment(hit.segment.id);
        selectStep(hit.step.id);
        const point = screenToFloor(event.clientX, event.clientY, hit.step.target[2]);
        stepDrag = {
          step: hit.step,
          offset: point ? [hit.step.target[0] - point[0], hit.step.target[1] - point[1]] : [0, 0],
          origin: [hit.step.target[0], hit.step.target[1], hit.step.target[2]],
        };
        return;
      }
      if (hitTestStartOrientation(event.clientX, event.clientY)) {
        orientDrag = {previewYaw: effectiveStartYaw()};
        return;
      }
      if (hitTestStart(event.clientX, event.clientY)) {
        const start = effectiveStart();
        const point = screenToFloor(event.clientX, event.clientY, start[2]);
        startDrag = {
          offset: point ? [start[0] - point[0], start[1] - point[1]] : [0, 0],
          previewPoint: start,
        };
        return;
      }
      if (event.ctrlKey || event.metaKey) {
        panning = true;
        manualCamera = true;
        return;
      }
      dragging = true;
    };
    canvas.onpointermove = event => {
      if (orientDrag) {
        const start = effectiveStart();
        const point = screenToFloor(event.clientX, event.clientY, start[2]);
        if (point) {
          // Inverse of forwardVector: solve yaw from the desired forward
          // angle (toward the mouse) rather than treating yaw itself as
          // that angle.
          orientDrag.previewYaw = Math.atan2(point[0] - start[0], -(point[1] - start[1]));
        }
        return;
      }
      if (startDrag) {
        const point = screenToFloor(event.clientX, event.clientY, startDrag.previewPoint[2]);
        if (point) {
          const [x, y] = clampPoint(point[0] + startDrag.offset[0], point[1] + startDrag.offset[1]);
          startDrag.previewPoint = [x, y, startDrag.previewPoint[2]];
        }
        return;
      }
      if (panning) {
        // Keep the world point under the cursor fixed: measure it with the
        // still-unmoved camera, then shift the camera by that delta.
        const before = screenToFloor(pointer[0], pointer[1], center[2]);
        const after = screenToFloor(event.clientX, event.clientY, center[2]);
        if (before && after) {
          center[0] += before[0] - after[0];
          center[1] += before[1] - after[1];
        }
        pointer = [event.clientX, event.clientY];
        return;
      }
      if (stepDrag) {
        // Drag on the horizontal plane at the waypoint's current height, so
        // moving XY never changes the height the user already dialed in.
        const point = screenToFloor(event.clientX, event.clientY, stepDrag.step.target[2]);
        if (point) {
          const [x, y] = clampPoint(point[0] + stepDrag.offset[0], point[1] + stepDrag.offset[1]);
          stepDrag.step.target = [x, y, stepDrag.step.target[2]];
          refreshHeightInput();
          updateStepPanel();
          markDirty();
        }
        return;
      }
      if (!dragging) return;
      const dx = event.clientX - pointer[0];
      const dy = event.clientY - pointer[1];
      if (Math.hypot(event.clientX - pointerStart[0], event.clientY - pointerStart[1]) > 4) {
        yaw += dx * 0.008;
        pitch = Math.max(-1.35, Math.min(1.35, pitch + dy * 0.008));
      }
      pointer = [event.clientX, event.clientY];
    };
    canvas.onpointerup = async event => {
      if (orientDrag) {
        startYaw = orientDrag.previewYaw;
        orientDrag = null;
        markDirty();
        return;
      }
      if (startDrag) {
        const [x, y] = startDrag.previewPoint;
        startDrag = null;
        const surface = await surfaceHeightAt(x, y);
        startPoint = [x, y, surface + settings.defaultHeight];
        markDirty();
        return;
      }
      if (panning) {
        panning = false;
        return;
      }
      if (stepDrag) {
        stepDrag = null;
        return;
      }
      if (!dragging) return;
      dragging = false;
      if (Math.hypot(event.clientX - pointerStart[0], event.clientY - pointerStart[1]) <= 4) {
        if (!startPlaced) {
          const hitPoint = raycastSurface(event.clientX, event.clientY);
          if (hitPoint) {
            const [x, y] = clampPoint(hitPoint[0], hitPoint[1]);
            startPoint = [x, y, hitPoint[2] + settings.defaultHeight];
            startPlaced = true;
            updateHint();
            markDirty();
          }
          return;
        }
        const step = selectedStep();
        if (step) {
          // Unproject with a rough height guess first (existing target, or
          // wherever the camera is looking), then snap to whatever's really
          // there — floor, stair, couch top — plus the standing offset.
          const guessZ = step.target ? step.target[2] : center[2];
          const point = screenToFloor(event.clientX, event.clientY, guessZ);
          if (point) {
            const [x, y] = clampPoint(point[0], point[1]);
            const surface = await surfaceHeightAt(x, y);
            step.target = [x, y, surface + settings.defaultHeight];
            refreshHeightInput();
            updateStepPanel();
            updateSegmentPanel();
            markDirty();
          }
        }
      }
    };
    canvas.onpointercancel = () => {
      dragging = false;
      stepDrag = null;
      startDrag = null;
      orientDrag = null;
      panning = false;
    };
    canvas.onwheel = event => {
      event.preventDefault();
      zoom = Math.max(0.25, Math.min(4, zoom * Math.exp(-event.deltaY * 0.001)));
    };
    addEventListener("resize", draw);

    updateSegmentPanel();
    updateStepPanel();
    updateReadout();
    updateHint();
    refreshScenePreview();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
