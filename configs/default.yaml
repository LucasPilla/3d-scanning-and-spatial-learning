# A runnable configuration that spells out every key, so this file doubles as
# the reference for what each one does. Other files only need the keys they
# change; anything they omit falls back to src/config.py::load_config, whose
# built-in values match this file except for `path` (no default) and
# `text_cache` (off, since a fresh checkout has no cache yet). Relative paths
# resolve against the working directory.

# Dataset
path: data/nymeriaplus
fps: 10.0
# 16, not v1's 48: the scene_crop_bounds below were validated against this
# window length. Re-checked at window_size=48, general-population anchor-
# local pelvis displacement reaches p99.9 of ~4-5m on x/y, well past what
# v1's own +/-1.6m bounds covered -- a second, independent cause of v1's
# broken scene conditioning alongside the floor-anchoring fix.
window_size: 16
history_size: 16
max_open_sequences: 8

# Diffusion
timesteps: 50

# Transformer. Each layer runs one shared self-attention over the motion
# tokens (history plus noisy future) concatenated with every enabled
# condition's tokens — there is no separate cross-attention path. The
# diffusion timestep does not enter the token sequence either; each block is
# modulated by AdaLN-Zero instead, driven by the timestep embedding.
# 72 = JOINT_COUNT (24) * 3, anchored joint positions, see src/utils/geometry.py
input_dim: 72
output_dim: 72
model_dim: 512
ff_size: 1024
heads: 8
layers: 8
dropout: 0.1

# Text. The prompt is kept as a sequence of frozen per-token embeddings that
# get concatenated onto the motion token sequence, so individual phrases can
# line up with individual phases of the window through shared self-attention.
# Prompts are padded or truncated to max_text_tokens; annotations average ~47
# tokens. CLIP cannot exceed 77, while bert (DistilBERT, what MDM's DiP uses)
# and t5 have room to spare.
# The cache stores every token, so it is max_text_tokens times larger than a
# pooled one — regenerate it whenever max_text_tokens or text_encoder changes.
text_enabled: true
text_dropout: 0.2
text_encoder: t5  # 'clip', 'bert', or 't5', see src/models/text_encoder.py
text_cache: true
max_text_tokens: 64
# Adds a progress_embedding submodule to the text encoder for where a sampled
# window sits within its annotation's span. Only matters for training a new
# model -- at inference, src/config.py::build_inference detects this per
# checkpoint instead (a checkpoint trained with this off has no
# progress_embedding weights, so it stays off for that checkpoint regardless
# of this setting).
window_progress_enabled: true

# Scene. The 3D CNN encoder emits one token per cell of its final feature
# volume, so different frames can attend to different regions of the crop. It
# always lands on a 4x4x4 volume (64 tokens) whatever scene_voxels is, and
# each token is positionally encoded with its own anchor-local cell center.
scene_enabled: true
scene_dropout: 0.2
scene_voxels: 64
# [xmin, xmax, ymin, ymax, zmin, zmax] around the anchor. x/y stay a
# symmetric +/-1.6m square, since the anchor's x/y is still the pelvis and
# nothing about facing direction favors one side. z is no longer symmetric:
# the anchor's z is now the estimated floor height (see src/utils/floor.py),
# not the pelvis's own height, so z=0 already sits at the ground and the
# volume that matters is almost entirely above it (furniture, shelves) with
# only a small margin needed below (floor-estimate noise, slight slopes).
# These bounds are empirically validated, not a placeholder: anchor-local
# pelvis displacement and floor-relative joint height were measured over
# sliding 16-history+16-future windows (matching window_size below) across
# both a general random sample and stairs-specific sequences, using the
# corrected (causal=False, see src/utils/floor.py) floor trace. [-1.6, 1.6]
# on x/y and [-0.8, 2.4] on z cover the general population through p99.9 on
# every axis; stairs runs moderately hotter at the tail (p95-p99 coverage),
# an accepted tradeoff rather than a failure, since stairs is a minority of
# windows. The three axes now span exactly 3.2m each -- a true cube -- and
# scene_voxels: 64 gives a uniform 5cm cell on every axis, downsampling
# cleanly as 64->32->16->8->4 in CNN3DSceneEncoder, unlike the old 60 which
# downsampled unevenly (60->30->15->8->4).
scene_crop_bounds: [-1.6, 1.6, -1.6, 1.6, -0.8, 2.4]

# Goal: the pelvis displacement (dx, dy, dz) in the anchor's canonical frame,
# always the window's own last frame, with no arrival time. Including dz is
# what makes sitting, standing, and stairs steerable. It is a soft,
# CFG-guided condition token exactly like text and scene now (no hard
# inpainting) — see docs/ARCHITECTURE.md — so it can be traded off against
# what text or scene imply instead of being forced regardless. Same dropout
# as text/scene, kept uniform for simplicity, even though goal is a leakier
# signal (it's exactly the window's own last frame) than text/scene.
goal_enabled: true
goal_dropout: 0.2

# Conditioning
# chance of dropping text, scene, and goal all together for joint CFG
joint_dropout: 0.05

# Losses. The single diffusion term is an MSE directly on the normalized
# anchored joint-position features (no forward kinematics involved), reported
# as one `total` scalar.
position_weight: 1.0

# Training
name: null
output: runs
resume_checkpoint: null
learning_rate: 0.0001
batch_size: 128
epochs: 1000
workers: 4
save_every: 10
