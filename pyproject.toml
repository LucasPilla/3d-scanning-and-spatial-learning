[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "nymeria-plus-motion"
version = "0.1.0"
description = "Nymeria Plus text-, scene-, and goal-conditioned motion diffusion"
readme = "README.md"
requires-python = ">=3.9,<3.12"
dependencies = [
  "numpy>=1.23.5,<1.24",
  "PyYAML>=6,<7",
  "tensorboard>=2.20,<3",
  "torch>=2.8,<2.9",
  "torchvision>=0.23,<0.24",
  "tqdm>=4.66,<5",
  "transformers>=4.51,<5",
  "vit-pytorch>=1.23,<2",
]

[project.optional-dependencies]
download = [
  "nymeriaplus>=1.0,<2",
]
preprocess = [
  "scipy>=1.12,<2",
  "smplx>=0.1.28,<0.2",
  "trimesh>=4.1,<5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
